conky.config = {
    alignment = 'top_right',
    background = false,
    double_buffer = true,
    draw_borders = false,
    draw_graph_borders = false,
    draw_outline = false,
    draw_shades = true,
    use_xft = true,
    font = 'DejaVu Sans:size=10',
    xftalpha = 0.94,
    gap_x = 34,
    gap_y = 82,
    minimum_width = 320,
    maximum_width = 320,
    minimum_height = 620,
    own_window = true,
    own_window_argb_visual = true,
    own_window_argb_value = 150,
    own_window_type = 'normal',
    own_window_transparent = true,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    update_interval = 1.0,
    use_spacer = 'none',
};
conky.text = [[
${color #36cfff}${font DejaVu Sans:size=9:bold}DNYAOS  /  LIVE STATUS${font}${color}
${color #36cfff}${hr 2}${color}
${font DejaVu Sans:size=34}${time %H:%M}${font} ${color #8beaff}${time %p}${color}
${font DejaVu Sans:size=11}${time %a, %d %b %Y}${font}
${voffset 8}${color #36cfff}${hr 1}${color}
${color #36cfff}${font DejaVu Sans:size=11:bold}SYSTEM HEALTH${font}${color}
${color #8beaff}CPU${color}  ${cpu cpu0}%  ${cpubar 6,205}
${color #8beaff}MEMORY${color}  ${memperc}%  ${mem} / ${memmax}
${membar 6,290}
${color #8beaff}ROOT DISK${color}  ${fs_used_perc /}%
${fs_bar 6,290 /}
${color #819db4}${fs_used /} used of ${fs_size /}${color}
${voffset 8}${color #36cfff}${hr 1}${color}
${color #36cfff}${font DejaVu Sans:size=11:bold}NOW PLAYING${font}${color}
${if_running vlc}${color #36cfff}VLC media player${color}${else}${color #819db4}Start VLC or play music in browser${color}${endif}
${execi 3 playerctl metadata --format '{{ title }}' 2>/dev/null | head -c 36}
${execi 3 playerctl metadata --format '{{ artist }}' 2>/dev/null | head -c 36}
${color #36cfff}${execi 3 playerctl status 2>/dev/null}${color}
${voffset 8}${color #36cfff}${hr 1}${color}
${color #36cfff}${font DejaVu Sans:size=11:bold}QUICK ACCESS${font}${color}
${color #dcecff}Firefox  ·  WhatsApp Web${color}
${color #dcecff}Snapchat Web  ·  Files${color}
${color #819db4}Use the bottom dock to launch apps${color}
${voffset 8}${color #36cfff}${hr 1}${color}
${alignc}${color #8beaff}SMALL BUG. BIG DREAMS.${color}
]];
