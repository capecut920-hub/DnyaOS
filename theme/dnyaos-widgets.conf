conky.config = {
    alignment = 'top_right',
    background = false,
    border_width = 1,
    cpu_avg_samples = 2,
    default_color = '#dcecff',
    double_buffer = true,
    draw_borders = false,
    draw_graph_borders = false,
    draw_outline = false,
    draw_shades = true,
    use_xft = true,
    font = 'DejaVu Sans:size=10',
    xftalpha = 0.9,
    gap_x = 28,
    gap_y = 78,
    minimum_width = 300,
    maximum_width = 300,
    minimum_height = 500,
    own_window = true,
    own_window_argb_visual = true,
    own_window_argb_value = 105,
    own_window_type = 'normal',
    own_window_transparent = true,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    update_interval = 1.0,
    use_spacer = 'none',
};
conky.text = [[
${color #36cfff}${font DejaVu Sans:size=9:bold}DNYAOS  /  LIVE STATUS${font}${color}
${color #36cfff}${hr 2}${color}
${font DejaVu Sans:size=34}${time %H:%M}${font} ${color #8beaff}${time %p}${color}
${font DejaVu Sans:size=11}${time %A, %d %B %Y}${font}
${voffset 12}${color #36cfff}${font DejaVu Sans:size=11:bold}SYSTEM${font}${color}
${color #8beaff}CPU${color}  ${cpu cpu0}% ${cpubar 6,190}
${color #8beaff}RAM${color}  ${memperc}%  ${mem} / ${memmax}
${membar 6,280}
${color #8beaff}ROOT${color} ${fs_used_perc /}%  ${fs_used /} / ${fs_size /}
${fs_bar 6,280 /}
${voffset 12}${color #36cfff}${font DejaVu Sans:size=11:bold}NOW PLAYING${font}${color}
${if_running vlc}${color #e52b43}VLC is running${color}${else}${color #8297ae}Open VLC to play your soundtrack${color}${endif}
${execi 3 playerctl metadata --format '{{ artist }} — {{ title }}' 2>/dev/null | head -c 44}
${voffset 12}${color #36cfff}${hr 1}${color}
${alignc}${color #8beaff}SMALL BUG. BIG DREAMS.${color}
]];
