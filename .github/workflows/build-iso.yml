name: Build DnyaOS ISO
on:
  workflow_dispatch:
  push:
    branches:
      - main
concurrency:
  group: dnyaos-iso-build
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      # live-build must mount /proc and /dev/pts inside its build chroot.
      options: --privileged
    timeout-minutes: 180
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build bootable ISO
        run: |
          chmod +x ./build-dnyaos.sh
          bash ./build-dnyaos.sh
      - name: Validate ISO and checksum
        run: |
          set -euo pipefail
          test -s out/DnyaOS-live-amd64.iso
          test -s out/DnyaOS-live-amd64.iso.sha256
          sha256sum -c out/DnyaOS-live-amd64.iso.sha256
          xorriso -indev out/DnyaOS-live-amd64.iso -toc
          xorriso -indev out/DnyaOS-live-amd64.iso -report_el_torito plain
      - name: Upload ISO and checksum
        uses: actions/upload-artifact@v4
        with:
          name: DnyaOS-live-amd64
          path: |
            out/DnyaOS-live-amd64.iso
            out/DnyaOS-live-amd64.iso.sha256
          if-no-files-found: error
          retention-days: 7
